name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/validate.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Build version-checked HACS archive
        run: python scripts/build_release.py "$RELEASE_TAG" moonside.zip
      - name: Generate archive checksum
        run: sha256sum moonside.zip > SHA256SUMS
      - name: Check release verification support
        run: gh release verify --help > /dev/null
      - name: Extract changelog notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          heading = f"## {version}\n"
          changelog = Path("CHANGELOG.md").read_text()
          if heading not in changelog:
              raise SystemExit(f"Missing changelog section for {version}")
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit(f"Empty changelog section for {version}")
          Path("release-notes.md").write_text(notes + "\n")
          PY
      - name: Create draft and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" moonside.zip SHA256SUMS
          --draft --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
      # Repository immutable-releases policy must remain enabled; GITHUB_TOKEN cannot change it.
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable')" = true
          # GitHub generates release attestations asynchronously after publication.
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo "Release attestation could not be verified within the retry window" >&2
          exit 1
