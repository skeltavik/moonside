name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install test dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run --locked ruff check custom_components/moonside tests
      - name: Check formatting
        run: uv run --locked ruff format --check custom_components/moonside tests
      - name: Run tests with coverage
        run: PYTHONPATH=. uv run --locked pytest --cov=custom_components.moonside --cov-report=term-missing
      - name: Scan Python code
        run: uv run --locked bandit -c pyproject.toml -r custom_components/moonside
      - name: Audit Python dependencies
        # Keep the audit strict; only the explicitly listed advisories are
        # known to affect the test stack and are intentionally excluded.
        run: |
          uv run --locked python -m pip_audit --local \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
