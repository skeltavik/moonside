<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#45b7d1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGradient)"/>
  
  <!-- Moon crescent -->
  <path d="M 180 60 A 40 40 0 1 1 180 140 A 30 30 0 1 0 180 60" fill="#f8f9fa" opacity="0.9"/>
  
  <!-- Lighthouse body -->
  <rect x="108" y="100" width="40" height="100" rx="4" fill="#2c3e50"/>
  
  <!-- Lighthouse stripes -->
  <rect x="108" y="120" width="40" height="15" fill="#e74c3c"/>
  <rect x="108" y="150" width="40" height="15" fill="#e74c3c"/>
  <rect x="108" y="180" width="40" height="15" fill="#e74c3c"/>
  
  <!-- Lighthouse top light housing -->
  <rect x="100" y="85" width="56" height="20" rx="3" fill="#34495e"/>
  
  <!-- Light beam effect -->
  <path d="M 128 95 L 60 40 L 80 95 Z" fill="url(#lightGradient)" opacity="0.6" filter="url(#glow)"/>
  <path d="M 128 95 L 196 40 L 176 95 Z" fill="url(#lightGradient)" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Main light -->
  <circle cx="128" cy="95" r="12" fill="url(#lightGradient)" filter="url(#glow)"/>
  
  <!-- Base -->
  <rect x="98" y="195" width="60" height="12" rx="2" fill="#34495e"/>
  
  <!-- Stars -->
  <circle cx="50" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="220" cy="70" r="2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="40" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="40" cy="100" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="230" cy="150" r="2" fill="white" opacity="0.6"/>
</svg>
